            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "¿Todas las ITS producen síntomas?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Algunas infecciones pueden no presentar síntomas, por lo que una evaluación y las pruebas indicadas por un profesional siguen siendo importantes."
                }
              },
              {
                "@type": "Question",
                "name": "¿Cuándo conviene consultar por síntomas de una ITS?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Conviene consultar si notas lesiones, flujo o secreción inusual, ardor al orinar, dolor pélvico, sangrado fuera de lo habitual o si tuviste una exposición que te preocupa."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué hago si tuve una exposición de riesgo al VIH?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Busca atención de urgencia de inmediato. La profilaxis post-exposición (PEP) debe iniciarse lo antes posible y dentro de las 72 horas posteriores a la exposición."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué es la PrEP?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "La profilaxis pre-exposición (PrEP) es una estrategia de prevención del VIH que requiere evaluación, indicación y seguimiento profesional."
                }
              },
              {
                "@type": "Question",
                "name": "¿El preservativo previene todas las ITS?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Reduce de manera importante el riesgo de muchas ITS, pero no elimina todo el riesgo de infecciones transmitidas por contacto de piel. Las vacunas, los controles y la comunicación con las parejas también ayudan."
                }
              }
            ]
          }
